<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('1:1 문의')}"></head>
<body>
<header th:replace="~{fragments :: nav('inq')}"></header>
<main class="narrow">
  <div th:replace="~{fragments :: flash}"></div>
  <h1>1:1 문의</h1>
  <p class="sub">이용 중 불편한 점을 남겨 주시면 관리자가 답변해 드려요.</p>
  <div class="card">
    <form th:action="@{/my/inquiries}" method="post">
      <label for="title" style="margin-top:0">제목</label>
      <input id="title" name="title" maxlength="100" required>
      <label for="content">내용</label>
      <textarea id="content" name="content" rows="4" maxlength="1000" required></textarea>
      <p><button class="btn" type="submit">문의 등록</button></p>
    </form>
  </div>
  <div class="card" th:each="q : ${inquiries}">
    <b th:text="${q.title}"></b> <span class="tiny" th:text="${#temporals.format(q.createdAt, 'MM-dd HH:mm')}"></span>
    <p th:text="${q.content}"></p>
    <div th:if="${q.answer != null}" style="background:var(--brand-soft);border-radius:12px;padding:12px 14px">
      <b>관리자 답변</b> <span class="tiny" th:text="${#temporals.format(q.answeredAt, 'MM-dd HH:mm')}"></span>
      <div th:text="${q.answer}"></div>
    </div>
    <div th:if="${q.answer == null}" class="muted">답변을 기다리는 중이에요.</div>
  </div>
</main>
<nav th:replace="~{fragments :: tabbar('inq')}"></nav>
</body>
</html>
